set timeout_style=menu

# Try to load previously saved entry (grubenv next to grub.cfg).
# Done first: the saved device decides the menu rotation below.
load_env

# Graphical terminal. The Air X panels are portrait (270° rotation),
# the Air Y panel is landscape (no rotation). Before a device has been
# picked once, the menu is drawn for the Air X.
if [ "${saved_entry}" = "airy" ]; then
    set rotation=0
else
    set rotation=270
fi
set gfxmode=auto
insmod efi_gop
insmod gfxterm
loadfont $prefix/dejavu-mono-48.pf2
terminal_output gfxterm

# Color scheme inspired by REG logo gradient (yellow → orange → red → purple → blue).
# GRUB palette: yellow = logo top, light-cyan = logo bottom.
set color_normal=light-gray/black
set color_highlight=light-gray/black
set menu_color_normal=yellow/black
set menu_color_highlight=black/light-cyan

if [ -z "${saved_entry}" ]; then
    # First boot: pick the device. Boots the original Air X (MQ66) after 10s.
    set default="0"
    set timeout="10"
else
    # Subsequent boots: boot straight into the saved entry.
    set default="${saved_entry}"
    set timeout="3"
fi

menuentry "Mangmi Air X" --id=airx-mq66 {
    set saved_entry="airx-mq66"
    save_env saved_entry
    linux /boot/linux label=REGLINUX rootwait fbcon=rotate:3 console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused quiet vt.global_cursor_default=0
    initrd /boot/initrd.lz4
    devicetree /boot/sm6115-mangmi-air-x-mq66.dtb
}

menuentry "Mangmi Air X (MQ65, TD4310 panel)" --id=airx-mq65 {
    set saved_entry="airx-mq65"
