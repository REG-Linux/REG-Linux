# SM6115 (MANGMI Air X / Air Y): the MI2S back ends only run S16_LE, use
# larger periods, and let idle ALSA nodes suspend so the LPASS macros and
# MI2S clocks can power down.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        api.alsa.period-size = 1024
        api.alsa.headroom = 512
        node.suspend-on-idle = true
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
