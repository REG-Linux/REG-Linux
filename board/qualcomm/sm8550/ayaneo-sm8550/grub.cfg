set timeout_style=menu

# Text-only color scheme (firmware text console).
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan
set color_normal=light-gray/black
set color_highlight=yellow/black

# Try to load previously saved entry (grubenv next to grub.cfg).
load_env

if [ -z "${saved_entry}" ]; then
    # First boot or missing env: show menu with no timeout.
    set default="0"
    set timeout="-1"
else
    # Subsequent boots: boot straight into the saved entry.
    set default="${saved_entry}"
    set timeout="3"
fi

menuentry "AYANEO Pocket S (2K)" --id=pockets2k {
    set saved_entry="pockets2k"
    save_env saved_entry
    linux /boot/linux label=REGLINUX rootwait earlycon fbcon=rotate:3 rootfstype=ramfs rw init=/init quiet clk_ignore_unused pd_ignore_unused vt.global_cursor_default=0 console=tty0 allow_mismatched_32bit_el0 fw_devlink.strict=1 pcie_ports=compat irqaffinity=0-2 cgroup.memory=nokmem,nosocket nosoftlockup usbcore.interrupt_interval_override=045e:028e:2
    initrd /boot/initrd.lz4
    devicetree /boot/qcs8550-ayaneo-pockets2k.dtb
}

