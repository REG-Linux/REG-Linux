image boot.vfat {
        vfat {
                extraargs = "-F 32 -n REGLINUX -S 512 -s 32"
		@files
        }

        size = 2G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0"
	}
	size = "512M"
	mountpoint = "/userdata"
}

image reglinux.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition REGLINUX {
		partition-type-uuid = EBD0A0A2-B9E5-4433-87C0-68B6B72699C7
		image = "boot.vfat"
		offset = 32K
		bootable = true
	}

	partition userdata {
		partition-type-uuid = L
		image = "userdata.ext4"
	}
}
