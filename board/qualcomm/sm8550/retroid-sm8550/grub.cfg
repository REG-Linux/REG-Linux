set timeout_style=menu

# Text-only color scheme (firmware text console).
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan
set color_normal=light-gray/black
set color_highlight=yellow/black

# Try to load previously saved entry (grubenv next to grub.cfg).
load_env

if [ -z "${saved_entry}" ]; then
    # First boot or missing env: show menu with no timeout.
    set default="0"
    set timeout="-1"
else
    # Subsequent boots: boot straight into the saved entry.
    set default="${saved_entry}"
    set timeout="3"
fi

menuentry "Retroid Pocket 6" --id=rp6 {
    set saved_entry="rp6"
    save_env saved_entry
    linux /boot/linux label=REGLINUX rootwait earlycon fbcon=rotate:3 rootfstype=ramfs rw init=/init quiet splash clk_ignore_unused pd_ignore_unused vt.global_cursor_default=0
    initrd /boot/initrd.lz4
    devicetree /boot/qcs8550-retroidpocket-rp6.dtb
}

menuentry "Retroid Pocket 6 (Top D-PAD)" --id=rp6topdpad {
    set saved_entry="rp6topdpad"
    save_env saved_entry
    linux /boot/linux label=REGLINUX rootwait earlycon fbcon=rotate:3 rootfstype=ramfs rw init=/init quiet splash clk_ignore_unused pd_ignore_unused vt.global_cursor_default=0
    initrd /boot/initrd.lz4
    devicetree /boot/qcs8550-retroidpocket-rp6-top-dpad.dtb
}

menuentry "Reboot" {
    reboot
}
