image boot.vfat {
	vfat {
		extraargs = "-F 32 -n REGLINUX"
		@files
	}
	size = 2G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0 -O ^metadata_csum"
	}
	size = "256M"
	mountpoint = "/userdata"
}

image reglinux.img {
	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1024
	}

	partition bootloader {
		in-partition-table = "no"
		image = "partitions/boot0.img"
		offset = 131072
	}

	partition boot-package {
		in-partition-table = "no"
		image = "partitions/boot_package.fex"
		offset = 16793600
	}

	partition boot {
		image = "partitions/boot.img"
		offset = 21495808
	}

	partition env {
		image = "partitions/env.img"
	}

	partition env-redund {
		image = "partitions/env.img"
	}

	partition boot-resource {
		partition-type-uuid = "F"
		bootable = "true"
		image = "boot.vfat"
	}

	partition userdata {
		partition-type-uuid = "F"
		image = "userdata.ext4"
	}
}
