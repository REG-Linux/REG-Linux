# HDMI sinks: 16-bit, with the period the ALSA stack used.
#
# PipeWire opens HDMI S32_LE with a 1024-frame period. On a Capcom Home Arcade
# (Allwinner H3) that made the TV drop HDMI sync every few minutes -- resolution
# banner, a couple of seconds of silence -- while the ALSA stack it replaced,
# driving the same DAI 16-bit with period 2048, never did. Pinning both values
# back stopped the drops outright.
#
# HDMI audio *bandwidth* does not depend on the sample format (the encoder packs
# IEC 60958 subframes either way), but the I2S bit clock into the encoder does:
# 32-bit frames clock it twice as fast, and a 1024 period doubles the DMA
# interrupt rate. That is enough on an SoC with little margin in that path.
#
# Nothing is lost: libretro cores emit int16 and RetroArch's stream is s16le, so
# S32 only padded it. Graph latency is unchanged -- PipeWire's quantum stays
# 1024 and buffer_size stays 32768; only the DMA period grows.
#
# Both matchers are needed. The card name carries "hdmi" on SoCs whose encoder
# is its own card (allwinner-hdmi, whose node is "...sound_card0.stereo-fallback"
# with no "hdmi" in it at all); the node name carries it on PCI HDA, where the
# card is "HDA Intel PCH" and the node "alsa_output.pci-....hdmi-stereo".
#
# The RP5's DisplayPort sink is deliberately NOT matched here (card
# "RetroidPocket", node "...HiFi__DisplayPort__sink"). It already pins S16LE for
# its own reason via board/qualcomm/sm8250/.../51-dp-audio-s16.conf, and it could
# not take this period regardless: q6asm-dai.c constrains that path's period size
# to a multiple of 480 frames, so 2048 would be snapped to 1920. Any board whose
# DAI has its own period step needs its own rule rather than this one.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "~.*[Hh][Dd][Mm][Ii].*"
      }
      {
        node.name = "~alsa_output\\..*[Hh][Dd][Mm][Ii].*"
      }
    ]
    actions = {
      update-props = {
        audio.format         = "S16LE"
        api.alsa.period-size = 2048
      }
    }
  }
]
