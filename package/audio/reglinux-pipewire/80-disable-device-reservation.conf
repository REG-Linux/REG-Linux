# Don't negotiate for sound cards over D-Bus.
#
# WirePlumber otherwise claims each card through org.freedesktop.ReserveDevice1,
# the protocol PulseAudio and JACK use to hand hardware back and forth. PipeWire
# is the only audio server here, so there is no second claimant to negotiate
# with -- only a dependency on dbus being up before a card can be opened.
#
# Despite the setting's name this is not ALSA configuration: it is WirePlumber
# policy about how it acquires devices.
wireplumber.profiles = {
  main = {
    monitor.alsa.reserve-device = disabled
  }
}
