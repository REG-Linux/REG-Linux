# Weston kiosk config for libmali boards. Critical knob: gbm-format
# = abgr8888 -- libmali's GBM allocator only handles ABGR8888 cleanly;
# any other format commits but never reaches scanout.

[core]
locking=false
idle-time=0
gbm-format=abgr8888

[shell]
background-color=0xff000000
locking=false

[input-method]
path=/usr/libexec/weston-keyboard

[output]
name=HDMI-A-1
mode=preferred
priority=9
