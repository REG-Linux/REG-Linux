# Anbernic RG DS: two 640x480 panels, DSI-2 on top, DSI-1 below.
output DSI-2 position 0 0
output DSI-1 position 0 480

# One Goodix per panel, told apart by their DT labels
input "1046:911:Goodix_Touchscreen_Top" map_to_output DSI-2
input "1046:911:Goodix_Touchscreen_Bottom" map_to_output DSI-1

# DraStic spans both panels; libdrastouch moves it to 0,0
for_window [app_id="drastic"] fullscreen disable, floating enable, border none, focus

# REG-Station on the bottom (touch) panel, focused: a game that exits leaves
# focus on whichever panel its last window was, and SDL drops unfocused input
for_window [app_id="regstation" title="^REG-Station$"] move container to output DSI-1, fullscreen enable, focus
# Its second window (system/game info, and Libra games) on the top panel,
# unfocused. These place new windows only: sway runs a rule once per window,
# so the swap and Libra moves come from regmsgd (dualPlace)
for_window [app_id="regstation" title="^REG-Station Secondary$"] move container to output DSI-2, fullscreen enable

# melonDS dual screen: [w1] top screen, [w2] bottom screen. Window 1 opens on
# the focused (bottom) panel, so it needs moving too.
for_window [app_id="net.kuribo64.melonDS" title="^\[w1\]"] move container to output DSI-2, fullscreen enable
for_window [app_id="net.kuribo64.melonDS" title="^\[w2\]"] move container to output DSI-1, fullscreen enable, focus

# RetroArch + melonDS core (Top/Bottom layout): fullscreen over all outputs,
# i.e. both stacked panels; RetroArch's own window size is then ignored
for_window [app_id="com.libretro.RetroArch" title="^RetroArch melonDS [0-9]"] fullscreen enable global, focus
