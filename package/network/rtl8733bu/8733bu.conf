# RTL8733BU (Miyoo Flip), from Zlyme. WiFi and Bluetooth share one chip and
# one firmware load: IPS ("card disable" when idle) would take Bluetooth
# down with WiFi, and deeper power save caused HTTPS timeouts on hotspots.
options 8733bu rtw_ips_mode=0 rtw_power_mgnt=0 rtw_lps_level=0 rtw_lps_chk_by_tp=1 rtw_enusbss=0

# Bluetooth resets the chip if btusb comes up before the WiFi driver.
softdep btusb pre: 8733bu
