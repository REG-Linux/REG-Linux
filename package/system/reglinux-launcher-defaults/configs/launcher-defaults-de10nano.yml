  core:     SNES
megadrive:
  emulator: mister
  core:     Genesis
mastersystem:
  emulator: mister
  core:     SMS
gamegear:
  emulator: mister
  core:     SMS
atari2600:
  emulator: mister
  core:     Atari2600
atari7800:
  emulator: mister
  core:     Atari7800
gb:
  emulator: mister
  core:     Gameboy
gbc:
  emulator: mister
  core:     Gameboy
gba:
  emulator: mister
  core:     GBA
neogeo:
  emulator: mister
  core:     NeoGeo
pcengine:
  emulator: mister
  core:     TurboGrafx16

# Non-FPGA overrides (keep existing)
