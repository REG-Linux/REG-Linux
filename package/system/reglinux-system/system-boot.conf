## Lines prefixed by double hashes (##) are comments.
## Lines prefixed by a single hash (#) are commented settings; remove the single hash to activate the setting.

## The device used to store the share data a.k.a. userdata.
## INTERNAL -> Use the same drive REG-Linux has been flashed to.
## ANYEXTERNAL -> Use the first external storage detected.
## Putting the name here of the drive instead will use that specific external storage. Use the menu in REG-Linux to see the available options.
## DEVICES -> Use external storage for individual folders.
## DEV -> Manually define the GUID of the storage device requested.
## NETWORK -> Use the network share, requires configuration first.
sharedevice=INTERNAL

## Add a wait time (in case the share device takes a while to come "online") in seconds.
#sharewait=15

## Automatically resize the userdata partition if unallocated space is present on the drive. Disables itself once completed successfully.
autoresize=true

## Change boot partition UUID and use the new UUID instead of Label in extlinux.conf. Disables itself once completed successfully.
newbootuuid=true

### GPU's ###

## Manually override Nvidia driver selected. Leave this setting commented to have REG-Linux automatically select the correct driver.
## true -> Use the current production driver.
## legacy -> Use the "legacy" 470 driver (could be subject to change, though unlikely).
## legacy390 -> Use the older 390 driver.
## false -> Use the open-source Nouveau drivers.

## Note: You DO NOT need to set this unless you want to select a particular compatible driver version.
#nvidia-driver=true

## Use the amdgpu Mesa driver over the redeon driver if supported. set to false to disable this if needed.
amdgpu=true

### Hybrid Laptops ###

## By default REG-Linux will detect laptops with multiple GPUs and set the appropriate prime value.
## You should not need to set the prime options below unless absolutely necessary.
## Set the boolean to false to disable accordingly.

## Helps with modern laptops (post-2018) with Nvidia hybrid graphics that default to using integrated graphics.
#nvidia-prime=true

## Helps with modern laptops with AMD hybrid graphics that default to using integrated graphics
#radeon-prime=true

## Maximum or specific machine resolution (get the full list for your display with "regmsg screen listmodes")
#rs.resolution=max-1920x1080

### USB gadget defaults ###
## system.usb.gadget=1 enables the USB gadget service
## system.usb.gadget.adb=1 enables the ADB gadget, which allows for ADB access over USB.
## If disabled, the MTP gadget will be used instead if system.usb.gadget=1 is set.
system.usb.gadget=1
system.usb.gadget.adb=0

### Controller HIDAPI ignore list ###
## Make SDL skip its HIDAPI driver for dead-hidraw controller clones (e.g. a fake-DS4 pad whose HIDAPI interface reports no input)
## so they fall back to the live kernel joydev node and can be mapped/used normally.
## Read at early boot by S06regmsgd (for emulators) and by the frontend launcher (for the UI/wizard).
## Example: controller.hidapi.ignore=0xVID/0xPID,0xVID/0xPID,0xVID/0xPID
controller.hidapi.ignore=0x2563/0x0526

### Boot-only settings ###
## Everything below is read before /userdata is mounted, so this file is its only home.
## If the user manually adds/edits same settings in /userdata/system.conf, those will be
## migrated to this file on the next boot and commented out in /userdata/system.conf.

## CPU governor. Leave unset to detect the best available one on each boot.
#system.cpu.governor=schedutil
## CPU power mode on AC / on battery.
## default, highperformance, balanced or powersaver.
#global.powermode=balanced
#global.batterymode=powersaver

## Screen brightness in percent (1-100). Defaults to 100.
#display.brightness=100

## Audio output device -- "regmsg audio listdevices" lists them.
#audio.device=auto
## Audio card profile.
#audio.profile=auto
## System volume (0-100).
#audio.volume=50
## Ceiling for boosted volume (100-150).
#audio.volume.boost=100

## Enforce security, requiring a password to access the network share.
## The matching rootshadowpassword line is generated by REG-Linux when this is
## enabled -- do not write it by hand.
#system.security.enabled=0

## Activate Wi-Fi (0,1)
#wifi.enabled=0
## Wi-Fi country code (00 for World)
#wifi.country=FR
## Wi-Fi SSID (string)
#wifi.ssid=new ssid
## Wi-Fi KEY (string)
## Escape your special chars (# ; $) with a backslash. eg. $ becomes \$
#wifi.key=new key
## Whether wifi.ssid is a hidden (non-broadcasting) network (0,1). Set
## automatically by the network picker; not meant to be hand-edited.
#wifi.hidden=0
## Saved-network history: wifi2 is the most recently used network before the
## current one, up to wifi9 (oldest). Populated automatically by the picker.
#wifi2.ssid=new ssid
#wifi2.key=new key
#wifi2.hidden=0

## File system compression (btrfs only). Natively compresses files
## as they are stored: reduces disk write speed, increases space available.
#system.fscompression.enabled=0
