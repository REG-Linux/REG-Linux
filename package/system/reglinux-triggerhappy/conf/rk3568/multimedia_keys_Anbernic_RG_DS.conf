KEY_VOLUMEUP                     1 /usr/bin/regmsg audio setvolume +5
KEY_VOLUMEUP                     2 /usr/bin/regmsg audio setvolume +5
KEY_VOLUMEDOWN                   1 /usr/bin/regmsg audio setvolume -5
KEY_VOLUMEDOWN                   2 /usr/bin/regmsg audio setvolume -5
KEY_MUTE                         1 /usr/bin/regmsg audio setmute toggle
KEY_VOLUMEUP+KEY_VOLUMEDOWN      1 /usr/bin/regmsg audio setmute toggle
KEY_LEFTMETA                     1 /usr/bin/regmsg brightness set cycle
KEY_VOLUMEUP+BTN_MODE            1 /usr/bin/regmsg brightness set +5
KEY_VOLUMEDOWN+BTN_MODE          1 /usr/bin/regmsg brightness set -5
KEY_POWER                        1 /usr/bin/system-shutdown 1
KEY_POWER                        0 /usr/bin/system-shutdown 0
KEY_F10+KEY_LEFTCTRL+KEY_LEFTALT 1 /etc/init.d/S31regstation restart
KEY_F11+KEY_LEFTCTRL+KEY_LEFTALT 1 chvt 1
KEY_SYSRQ                        1 regmsg screen getscreenshot
SW_LID                           1 /usr/bin/system-shutdown lid
