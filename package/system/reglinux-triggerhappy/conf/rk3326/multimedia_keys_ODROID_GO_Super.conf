# Volume -
KEY_VOLUMEDOWN  1  /usr/bin/regmsg audio setvolume -5

# Volume +
KEY_VOLUMEUP  1  /usr/bin/regmsg audio setvolume +5

# mute toggle
KEY_VOLUMEDOWN+KEY_VOLUMEUP  1  /usr/bin/regmsg audio setmute toggle

# Brightness -
BTN_TRIGGER_HAPPY3  1  /usr/bin/regmsg brightness set -5

# Brightness +
BTN_TRIGGER_HAPPY4  1  /usr/bin/regmsg brightness set +5

KEY_POWER                        1 /usr/bin/system-shutdown 1
KEY_POWER                        0 /usr/bin/system-shutdown 0
