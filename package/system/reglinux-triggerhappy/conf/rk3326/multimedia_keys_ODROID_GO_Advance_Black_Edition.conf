# Volume -
BTN_TRIGGER_HAPPY2  1  /usr/bin/regmsg audio setvolume -5

# Volume +
BTN_TRIGGER_HAPPY3  1  /usr/bin/regmsg audio setvolume +5

# mute toggle
BTN_TRIGGER_HAPPY2+BTN_TRIGGER_HAPPY3  1  /usr/bin/regmsg audio setmute toggle

# Brightness -
BTN_TRIGGER_HAPPY4  1  /usr/bin/regmsg brightness set -5

# Brightness +
BTN_TRIGGER_HAPPY5  1  /usr/bin/regmsg brightness set +5

KEY_POWER                        1 /usr/bin/system-shutdown 1
KEY_POWER                        0 /usr/bin/system-shutdown 0
