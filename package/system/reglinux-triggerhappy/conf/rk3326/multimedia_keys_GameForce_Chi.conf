# Button 1 (Volume -)
BTN_TRIGGER_HAPPY1  1  /usr/bin/regmsg audio setvolume -5

# Button 2 (Volume +)
BTN_TRIGGER_HAPPY2  1  /usr/bin/regmsg audio setvolume +5

# Button 1 + Button 2 (mute toggle)
BTN_TRIGGER_HAPPY1+BTN_TRIGGER_HAPPY2  1  /usr/bin/regmsg audio setmute toggle

# HK + Button 1 (Brightness -)
BTN_TRIGGER_HAPPY1+BTN_TRIGGER_HAPPY3  1  /usr/bin/regmsg brightness set -5

# HK + Button 2 (Brightness +)
BTN_TRIGGER_HAPPY2+BTN_TRIGGER_HAPPY3  1  /usr/bin/regmsg brightness set +5

KEY_POWER                        1 /usr/bin/system-shutdown 1
KEY_POWER                        0 /usr/bin/system-shutdown 0
